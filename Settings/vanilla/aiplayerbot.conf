###################################################################################################
# WORLD BUFFS
#
# Applies permanent buffs to bots matching specific criteria.
#
# Format:
#   AiPlayerbot.WorldBuff[.Faction[.Class[.MinLevel[.MaxLevel[,EventID]]]]] = spellId[,spellId2,...]
#
# Each segment is optional - omit trailing segments to broaden the match:
#   Faction  : 0 = All  | 1 = Alliance  | 2 = Horde
#   Class    : 0 = All  | 1 = Warrior | 2 = Paladin | 3 = Hunter | 4 = Rogue
#              5 = Priest | 7 = Shaman | 8 = Mage | 9 = Warlock | 11 = Druid
#   MinLevel : Minimum character level (inclusive)
#   MaxLevel : Maximum character level (inclusive)
#   EventID  : Only apply during this in-game event (see GameEvent table)
#
# Multiple spell IDs can be comma separated to apply several buffs at once.
#
# Examples:
#   AiPlayerbot.WorldBuff = 22888
#     All bots receive Rallying Cry of the Dragonslayer
#
#   AiPlayerbot.WorldBuff.2 = 16609
#     All Horde bots receive Warchief's Blessing
#
#   AiPlayerbot.WorldBuff.0.0.40 = 24425
#     All bots level 40+ receive Spirit of Zandalar
#
#   AiPlayerbot.WorldBuff.0.9.1.10 = 18149,3436
#     All Warlock bots between level 1-10 receive Volatile Infection and Wandering Plague
#
#   AiPlayerbot.WorldBuff.1.4.60 = 12566,11305,2379
#     All Alliance Rogue bots at level 60 receive Plainsrunning, Sprint and Speed
#
#   AiPlayerbot.WorldBuff.0.0.0.0.0.4 = 23768
#     All bots receive Sayge's Dark Fortune of Damage during Darkmoon Faire (EventID 4)
#
