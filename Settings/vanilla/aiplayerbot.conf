[AiPlayerbotConf]
ConfVersion=2020072501

###################################################################################################
# RESET / CLEANUP - USE WITH CAUTION
#
# These flags delete all bot-generated data of the specified type on next server start.
# They reset to 0 automatically after running — they are one-shot operations not
# permanent settings. Use only when you want a full wipe of bot-created content.
#
# DeleteRandomBotAccounts    = wipes ALL bot accounts and characters (full reset)
# DeleteRandomBotGuilds      = removes all guilds created by bots
# DeleteRandomBotArenaTeams  = removes all arena teams created by bots
#
# Typical use: set to 1, restart server, verify cleanup, confirm back to 0.
###################################################################################################

AiPlayerbot.DeleteRandomBotAccounts = 0
AiPlayerbot.DeleteRandomBotGuilds = 0
AiPlayerbot.DeleteRandomBotArenaTeams = 0

###################################################################################################
# CORE - Enable / Disable
#
# Master switches for the bot system. These control whether bots exist at all,
# whether they create themselves automatically, and how they behave on server start.
#
# Startup sequence:
#   Enabled           = 0 disables everything
#   RandomBotAutoCreate = creates missing bot accounts/characters on startup
#   RandomBotAutologin  = logs in random bots automatically
#   RandomBotLoginAtStartup = logs in all bots immediately on server start
#                             vs waiting for the first rebalance cycle
#
# Note: RandomBotLoginAtStartup with 1000 bots will cause a heavy DB load spike
# on server start as all bots load simultaneously. If startup is slow or crashes
# consider disabling this and letting the rebalance cycle populate bots gradually
# via RandomBotsMaxLoginsPerInterval instead.
###################################################################################################

AiPlayerbot.Enabled = 1
AiPlayerbot.ShowProgressBars = 1          

# Bot creation and login
AiPlayerbot.RandomBotAutoCreate = 1       
AiPlayerbot.RandomBotAutologin = 1        
AiPlayerbot.RandomBotLoginAtStartup = 0  

# Appearance
AiPlayerbot.RandomBotShowHelmet = 1       
AiPlayerbot.RandomBotShowCloak = 1        

# Allow non-GM players to summon bots freely
AiPlayerbot.NonGmFreeSummon = 1
# Auto-login player alts as bots on player login
AiPlayerbot.BotAutologin = 0

# Disable automatic DBStore save (0=auto save)
AiPlayerbot.ExplicitDbStoreSave = 0       

###################################################################################################
# BOT POPULATION & CYCLE
#
# This section controls how many bots exist, how they cycle in and out, and how fast
# the server rebalances the online population. Together these settings simulate a natural
# play cycle — bots log in for a session, then go offline for a while before returning.
#
# Key relationships:
#   AccountCount  = total bot characters that can ever exist (pool size)
#   MaxRandomBots = maximum online at any one time
#   MinRandomBots = minimum the server tries to maintain online
#
#   AccountCount should always be significantly larger than MaxRandomBots
#   so there is always a pool of offline bots ready to cycle in.
#   Example: 500 accounts, 1000 max online — the server cycles through
#   the same accounts but each account can have multiple characters.
#
# Session cycle (how long a bot stays online before logging off):
#   MinRandomBotInWorldTime / MaxRandomBotInWorldTime
#   Each bot gets a random session length within this range.
#   Example: 3600-16200 = bots play for 1 to 4.5 hours per session
#
# Offline cycle (how long a bot stays offline before logging back in):
#   MinRandomBotRandomizeTime / MaxRandomRandomizeTime
#   Each bot gets a random offline window within this range.
#   Example: 7200-43200 = bots are offline for 2 to 12 hours
#
# At any given time roughly:
#   OnlineFraction = AvgSessionTime / (AvgSessionTime + AvgOfflineTime)
#   With current settings: 9900 / (9900 + 25200) = ~28% online at once
#   So with 500 accounts expect ~140-500 bots online at any time naturally
#
# Rebalance cycle (how often the server checks and adjusts online population):
#   RandomBotCountChangeMinInterval / RandomBotCountChangeMaxInterval
#   Lower values = faster population adjustments, higher DB load
#   Higher values = slower adjustments, gentler on resources
#
# Login rate (how many bots log in per rebalance cycle):
#   RandomBotsMaxLoginsPerInterval
#   100 bots per cycle with 10-30 min intervals = full population
#   restored in roughly 1.5 to 5 hours after a restart
#
# Bot AI tick rate (how often each bot re-evaluates its situation):
#   RandomBotUpdateInterval = 1000ms (1 second)
#   Lower = more responsive bots, higher CPU cost
#   Higher = sluggish bots, lower CPU cost
#
###################################################################################################

# --- Online/Offline Cycle ---
AiPlayerbot.RandomBotTimedLogout = 1                  # Enable timed logout (0/1 toggle)
AiPlayerbot.MinRandomBotInWorldTime = 3600            # Min session length (1 hour)
AiPlayerbot.MaxRandomBotInWorldTime = 16200           # Max session length (4.5 hours)

AiPlayerbot.RandomBotTimedOffline = 1                 # Enable timed offline (0/1 toggle)
AiPlayerbot.MinRandomBotRandomizeTime = 21600          # Min offline window (6 hours)
AiPlayerbot.MaxRandomRandomizeTime = 43200            # Max offline window (12 hours)

# --- Rebalance & Login Rate ---
AiPlayerbot.RandomBotCountChangeMinInterval = 600     # Rebalance check min (10 minutes)
AiPlayerbot.RandomBotCountChangeMaxInterval = 1800    # Rebalance check max (30 minutes)
AiPlayerbot.RandomBotsMaxLoginsPerInterval = 100      # Max bots logging in per rebalance cycle
AiPlayerbot.RandomBotUpdateInterval = 1000            # Bot AI tick rate in ms (default 1000)

# --- Population Counts ---
AiPlayerbot.MinRandomBots = 400                       # Minimum bots the server keeps online
AiPlayerbot.MaxRandomBots = 1000                      # Maximum bots allowed online at once
AiPlayerbot.RandomBotMinLevel = 1                     # Minimum level bots can be created at
AiPlayerbot.RandomBotMaxLevel = 60                    # Maximum level bots can be created at

# --- Accounts ---
# AccountCount × 9 characters = total characters in DB
# 500 accounts = up to 4500 characters
# Keep AccountCount > MaxRandomBots for a healthy offline pool to cycle from
AiPlayerbot.RandomBotAccountPrefix = RNDBOT
AiPlayerbot.RandomBotAccountCount = 500

# Enable natural leveling - bots start at StartingLevel and level up by playing
AiPlayerbot.DisableRandomLevels = 1
AiPlayerbot.randombotStartingLevel = 1
AiPlayerbot.XPRate = 4                  # Set XP rate for bots - Server XP Rate * XPRate

# Only used when DisableRandomLevels = 0
# AiPlayerbot.RandomBotMinLevel = 1
# AiPlayerbot.RandomBotMaxLevel = 60
# AiPlayerbot.RandomBotMaxLevelChance = 0.15    # 15% chance to spawn at max level

