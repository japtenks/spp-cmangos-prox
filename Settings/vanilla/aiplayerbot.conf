##################################################################################################
# AUTOMATED GEAR PROGRESSION SYSTEM
#
# When a player receives a gear upgrade that moves them into a new progression tier
# (determined by item level), bots invited to their group/raid are automatically
# re-geared to an equivalent set for that same tier.
#
# Enable/disable the system:
#   AiPlayerbot.GearProgressionSystem.Enable = 0
#
# Format:
#   AiPlayerbot.GearProgressionSystem.<Tier>.<Class>.<Spec>.<Slot> = <itemId>
#   AiPlayerbot.GearProgressionSystem.<Tier>.MinItemLevel = <ilvl>
#   AiPlayerbot.GearProgressionSystem.<Tier>.MaxItemLevel = <ilvl>
#
# Tier    : 0=Base/Pre-Raid | 1=Tier1/MC | 2=Tier2/BWL | 3=ZG/AQ20 | 4=AQ40 | 5=Naxx
# Class   : 1=Warrior | 2=Paladin | 3=Hunter | 4=Rogue  | 5=Priest
#           7=Shaman  | 8=Mage    | 9=Warlock | 11=Druid
# Spec    : Varies by class - see class spec definitions below
# Slot    : 0=Head  | 1=Neck    | 2=Shoulder | 3=Shirt  | 4=Chest  | 5=Waist
#           6=Legs  | 7=Feet    | 8=Wrists   | 9=Hands  | 10=Ring1 | 11=Ring2
#           12=Trinket1 | 13=Trinket2 | 14=Back | 15=MainHand | 16=OffHand
#           17=Ranged   | 18=Tabard
#
# Spec IDs by class:
#   Warrior (1)  : 0=Arms          | 1=Fury         | 2=Protection
#   Paladin (2)  : 0=Holy          | 1=Protection   | 2=Retribution
#   Hunter (3)   : 0=BeastMaster   | 1=Marksmanship | 2=Survival
#   Rogue (4)    : 0=Assassination | 1=Combat       | 2=Subtlety
#   Priest (5)   : 0=Discipline    | 1=Holy         | 2=Shadow
#   Shaman (7)   : 0=Elemental     | 1=Enhancement  | 2=Restoration
#   Mage (8)     : 0=Arcane        | 1=Fire         | 2=Frost
#   Warlock (9)  : 0=Affliction    | 1=Demonology   | 2=Destruction
#   Druid (11)   : 0=Balance       | 1=Feral        | 2=Restoration | 3=Feral Tank
#
# Example:
#   AiPlayerbot.GearProgressionSystem.2.1.1.15 = 17075
#   Tier 2 (BWL), Warrior, Fury spec, Main Hand slot = item 17075
#
# Set item ID to 0 to leave that slot empty for a given spec.
# Use https://www.wowhead.com/classic/item= to look up item IDs.
##################################################################################################

AiPlayerbot.GearProgressionSystem.Enable = 0

