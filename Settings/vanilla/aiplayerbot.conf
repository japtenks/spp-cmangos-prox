###################################################################################################
# BOT LOGIN CRITERIA
# Controls which bots are prioritized to log in/stay online
# Enable = 1
#
# Criteria options:
#   maxbots    - Keep total bots below maximum
#   spareroom  - Keep spare room for better-priority bots
#   bg         - Keep bots online inside battlegrounds
#   arena      - Keep bots online inside arenas
#   instance   - Keep bots online inside instances
#   online     - Currently online bots stay online
#   logoff     - Bots slated to log off do so (needs RandomBotTimedLogout)
#   offline    - Bots slated to stay offline do so (needs RandomBotTimedOffline)
#   classrace  - Match online bots to configured class/race probabilities
#   level      - Match online bots to configured level probabilities
#   range      - Prefer bots near an online player
#   map        - Prefer bots on the same map as an online player
#   group      - Prefer bots in the same group as an online player
#   guild      - Prefer bots in the same guild as an online player
#
# Lines work as AND (all must be true). Multiple lines work as OR (top lines used first).
###################################################################################################

# Enable the alternative asynchronous login system.
AiPlayerbot.AsyncBotLogin = 1

AiPlayerbot.DefaultLoginCriteria1 = maxbots,spareroom,offline
AiPlayerbot.LoginCriteria.1 = instance           
AiPlayerbot.LoginCriteria.2 = bg
AiPlayerbot.LoginCriteria.3 = arena
AiPlayerbot.LoginCriteria.4 = guild
AiPlayerbot.LoginCriteria.5 = logoff,classrace,level,online
AiPlayerbot.LoginCriteria.6 = logoff,classrace,level
AiPlayerbot.LoginCriteria.7 = logoff,classrace

# Spare room below maximum for non-matching bots
# AiPlayerbot.FreeRoomForNonSpareBots = 0

# Level probability overrides (default 100 for all levels)
# AiPlayerbot.LevelProbability.1 = 100
# AiPlayerbot.LevelProbability.10 = 100
# AiPlayerbot.LevelProbability.60 = 100


