###################################################################################################
# LLM / AI CHAT
#
###################################################################################################
# Allows bots to respond to players using a Large Language Model (LLM) API.
# Bots use the 'ai chat' non-combat strategy to generate contextual roleplay responses.
#
# Quick start: Download KoboldCPP + a 7b model from HuggingFace, start Kobold, enable below.
#
# LLMEnabled modes:
#   0 = Disabled
#   1 = Enabled, bots use ai chat strategy when assigned
#   2 = ai chat strategy default for ALL bots
#   3 = Enabled but without ai chat strategy (manual use only)
#
# Prompt template variables available:
#   <expansion name>  <bot name>     <bot level>   <bot gender>  <bot race>
#   <bot class>       <bot zone>     <bot subzone> <bot type>
#   <other name>      <other type>   <other level> <other gender><other race>
#   <other class>     <other faction><channel name>
#   <receiver name>   <initial message>            <sender name>
#   <unit name>       <unit subname> <unit type>   <unit level>  <unit gender>
#   <unit race>       <unit faction> <unit class>
#
# Response parsing is a 4-step pipeline applied to raw LLM JSON output:
#   Step 1 (StartPattern)  - Find where the LLM response text begins in the JSON
#   Step 2 (EndPattern)    - Find where the response ends
#   Step 3 (DeletePattern) - Strip unwanted characters/patterns from the response
#   Step 4 (SplitPattern)  - Split cleaned response into individual bot chat lines
###################################################################################################

# --- Core ---
# AiPlayerbot.LLMEnabled = 0

# --- API Connection ---
# AiPlayerbot.LLMApiEndpoint = http://127.0.0.1:5001/api/v1/generate
# AiPlayerbot.LLMApiKey =
# AiPlayerbot.LLMApiJson = {"max_length": 100, "prompt": "[<pre prompt>]<context> <prompt> <post prompt>"}

# --- Generation Limits ---
# AiPlayerbot.LLMContextLength = 4096          # Max context length (0 = no limit)
# AiPlayerbot.LLMGenerationTimeout = 600       # Seconds to wait for generation (includes queue)
# AiPlayerbot.LLMMaxSimultaniousGenerations = 100

# --- Prompt Templates ---
# AiPlayerbot.LLMPrePrompt = You are a roleplaying character in World of Warcraft: <expansion name>. Your name is <bot name>. The <other type> <other name> is speaking to you <channel name> and is an <other gender> <other race> <other class> of level <other level>. You are level <bot level> and play as a <bot gender> <bot race> <bot class> that is currently in <bot subzone> <bot zone>. Answer as a roleplaying character. Limit responses to 100 characters.
# AiPlayerbot.LLMPrompt = <receiver name>:<initial message>
# AiPlayerbot.LLMPostPrompt = <bot name>:
# AiPlayerbot.LLMRpgPrompt = In World of Warcraft: <expansion name> in <bot zone> <bot subzone> stands <bot type> <bot name> a level <bot level> <bot gender> <bot race> <bot class>. Standing nearby is <unit type> <unit name> <unit subname> a level <unit level> <unit gender> <unit race> <unit faction> <unit class>. Answer as a roleplaying character. Limit responses to 100 characters.

# --- Response Parsing Pipeline ---
# AiPlayerbot.LLMResponseStartPattern  = ("text":\s*")
# AiPlayerbot.LLMResponseEndPattern    = ("|\b(?!<sender name>\b)(\w+):)
# AiPlayerbot.LLMResponseDeletePattern = (\\n|<sender name>:|\\[^ ]+)
# AiPlayerbot.LLMResponseSplitPattern  = (\*.*?\*)|(\[.*?\])|(\'.*\')|([^\*\[\] ][^\*\[\]]+?[.?!])

# --- Bot Behaviour ---
# AiPlayerbot.LLMGlobalContext = 0             # Mix conversations from all channels into context
# AiPlayerbot.LLMBotToBotChatChance = 0        # Chance (0-100) bots use ai chat to reply to other bots
# AiPlayerbot.LLMRpgAIChatChance = 100         # Chance (0-100) bots use ai chat when talking to NPCs during RPG
# AiPlayerbot.LLMBlockedReplyChannels =        # Channels where ai-chat replies are disabled
#   Options: guild,world,general,trade,lfg,ldefence,wdefence,grecruitement,say,whisper,emote,temote,yell,party,raid

# --- Character Cards ---
# Per-bot personality overrides. Create llm_character_card.txt in the server root folder.
# Format: one entry per line as  name::personality text
# Example:
#   Celguar::I am the Keeper of the Source.
#   Mostlikely::I like to travel a lot.
#   Flekz::I hold the power of ancient wizardry.
#AiPlayerbot.LLMDefaultPromptsFile = llm_character_card.txt

# --- Provider Examples ---
#
# KoboldCPP (default):
#   AiPlayerbot.LLMApiEndpoint = http://127.0.0.1:5001/api/v1/generate
#   AiPlayerbot.LLMApiJson = {"max_length": 100, "prompt": "[<pre prompt>]<context> <prompt> <post prompt>"}
#   AiPlayerbot.LLMResponseStartPattern = ("text":\s*")
#
# OpenAI / compatible (GPT-4o-mini etc):
#   AiPlayerbot.LLMApiEndpoint = http://IP/URL:PORT/v1/chat/completions
#   AiPlayerbot.LLMApiKey = YOUR_API_KEY
#   AiPlayerbot.LLMApiJson = {"model": "gpt-4o-mini", "messages": [{"role": "system", "content": "<pre prompt> <context>"},{"role": "user", "content": "<prompt>"}],"max_tokens": 60}
#   AiPlayerbot.LLMResponseStartPattern = ("content":\s*")

###################################################################################################
# CLASS / RACE POPULATION DISTRIBUTION
#
# Controls the probability of random bots being created with a given class and/or race combination.
#
# Format:
#   AiPlayerbot.ClassRaceProb.<class>.<race> = <number>
#
# All probabilities are relative to each other — setting all values to 200 is identical to setting all to 5.
# The number of bots allowed for a combo is calculated as:
#   ( probability * totalBots / total probability of all combos ) + 1
# Setting a value to 0 completely prevents that combo from being created.
#
# The system reads overrides in this order (most specific wins):
#   default → race → class → race + class
#
# So if you set Human = 50 and Warrior = 75, Human Mage = 65, Orc Warrior = 55:
#   All Humans (except Mage and Warrior) have 50% lower chance
#   All non-Orc Warriors have 75% lower chance
#   Human Mages have 65% lower chance
#   Orc Warriors have 55% lower chance
#
# Class IDs : 1=Warrior | 2=Paladin | 3=Hunter | 4=Rogue  | 5=Priest
#             7=Shaman  | 8=Mage    | 9=Warlock | 11=Druid
# Race IDs  : 1=Human | 2=Orc | 3=Dwarf | 4=NightElf | 5=Undead
#             6=Tauren | 7=Gnome | 8=Troll
# Use .0 suffix on class or race alone to set a global override for that class/race
#   e.g. AiPlayerbot.ClassRaceProb.1.0 = 178   sets the global Human population weight
#
# Source: https://web.archive.org/web/20050115034332/http://www.warcraftrealms.com/census.php
###################################################################################################

# Use fixed counts instead of probability-based generation
# AiPlayerbot.ClassRace.UseFixedClassRaceCounts = 0

